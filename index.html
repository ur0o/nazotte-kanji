<!doctype html>
<html lang="ja">
  <head>

    <meta
      name="description"
      content="漢字の各画が終わる位置と、とめ・はね・はらいだけを手がかりに漢字を当てるクイズ。毎日2問の「今日の1文字」と、外れるまで続く「エンドレス」で遊べます。"
    />
    <title>nazotte漢字</title>
    <!-- SNS で共有したときの表示(OGP / X のカード)。画像と URL は公開先の絶対 URL。
         X は小さな正方形のカード(summary)なので、正方形の画像を使う -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="nazotte漢字" />
    <meta property="og:title" content="nazotte漢字" />
    <meta
      property="og:description"
      content="漢字の各画が終わる位置と、とめ・はね・はらいだけを手がかりに漢字を当てるクイズ。毎日2問の「今日の1文字」と、外れるまで続く「エンドレス」で遊べます。"
    />
    <meta property="og:url" content="https://ur0o.github.io/kanji-nazori/" />
    <meta
      property="og:image"
      content="https://ur0o.github.io/kanji-nazori/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="「手」の各画の終わる位置に、とめ・はね・はらいの記号と書き順の番号を示した例と、タイトル「nazotte漢字」"
    />
    <meta property="og:locale" content="ja_JP" />

    <meta name="twitter:title" content="nazotte漢字" />

      name="twitter:description"
      content="漢字の各画が終わる位置と、とめ・はね・はらいだけを手がかりに漢字を当てるクイズ。毎日2問の「今日の1文字」と、外れるまで続く「エンドレス」で遊べます。"
    />
    <meta
      name="twitter:image"
      content="https://ur0o.github.io/kanji-nazori/og-image-square.png"
    />
    <meta
      name="twitter:image:alt"
      content="「手」の各画の終わる位置に、とめ・はね・はらいの記号と書き順の番号を示した例"
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
